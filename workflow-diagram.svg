<svg viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1400" height="760" fill="#12141c"/>

  <!-- Title -->
  <text x="30" y="40" fill="#ffffff" font-size="24" font-weight="bold">Sales Data Pipeline — Google Sheets → Supabase</text>
  <text x="30" y="64" fill="#9aa0ac" font-size="14">n8n workflow · runs daily at 06:00</text>

  <!-- Trigger -->
  <circle cx="90" cy="220" r="42" fill="#2a2d3a" stroke="#5b8def" stroke-width="2"/>
  <text x="90" y="216" fill="#ffffff" font-size="12" text-anchor="middle">Daily</text>
  <text x="90" y="230" fill="#ffffff" font-size="12" text-anchor="middle">06:00</text>

  <!-- Fetch Sheets -->
  <g>
    <rect x="200" y="80" width="170" height="60" rx="10" fill="#1f6f43" stroke="#2ecc71" stroke-width="1.5"/>
    <text x="285" y="105" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="bold">Fetch Sheet 1</text>
    <text x="285" y="123" fill="#d5f5e3" font-size="11" text-anchor="middle">Google Sheets</text>

    <rect x="200" y="190" width="170" height="60" rx="10" fill="#1f6f43" stroke="#2ecc71" stroke-width="1.5"/>
    <text x="285" y="215" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="bold">Fetch Sheet 2</text>
    <text x="285" y="233" fill="#d5f5e3" font-size="11" text-anchor="middle">Google Sheets</text>

    <rect x="200" y="300" width="170" height="60" rx="10" fill="#1f6f43" stroke="#2ecc71" stroke-width="1.5"/>
    <text x="285" y="325" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="bold">Fetch Sheet 3</text>
    <text x="285" y="343" fill="#d5f5e3" font-size="11" text-anchor="middle">Google Sheets</text>
  </g>

  <!-- Normalize -->
  <g>
    <rect x="420" y="80" width="160" height="60" rx="10" fill="#2d3346" stroke="#7d8ab8" stroke-width="1.5"/>
    <text x="500" y="105" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="bold">Normalize</text>
    <text x="500" y="123" fill="#c3c9e0" font-size="11" text-anchor="middle">common schema</text>

    <rect x="420" y="190" width="160" height="60" rx="10" fill="#2d3346" stroke="#7d8ab8" stroke-width="1.5"/>
    <text x="500" y="215" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="bold">Normalize</text>
    <text x="500" y="233" fill="#c3c9e0" font-size="11" text-anchor="middle">common schema</text>

    <rect x="420" y="300" width="160" height="60" rx="10" fill="#2d3346" stroke="#7d8ab8" stroke-width="1.5"/>
    <text x="500" y="325" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="bold">Normalize</text>
    <text x="500" y="343" fill="#c3c9e0" font-size="11" text-anchor="middle">common schema</text>
  </g>

  <!-- Merge -->
  <rect x="640" y="190" width="150" height="60" rx="10" fill="#3a2d5c" stroke="#9b7fd4" stroke-width="1.5"/>
  <text x="715" y="215" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="bold">Merge</text>
  <text x="715" y="233" fill="#e0d5f5" font-size="11" text-anchor="middle">append all 3</text>

  <!-- Dedupe -->
  <rect x="840" y="190" width="160" height="60" rx="10" fill="#5c3d2d" stroke="#e0955c" stroke-width="1.5"/>
  <text x="920" y="215" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="bold">Remove Duplicates</text>
  <text x="920" y="233" fill="#f5e0d5" font-size="11" text-anchor="middle">by recordId</text>

  <!-- Supabase -->
  <rect x="1050" y="190" width="160" height="60" rx="10" fill="#1e4a5c" stroke="#5cc8e0" stroke-width="1.5"/>
  <text x="1130" y="215" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="bold">Insert → Supabase</text>
  <text x="1130" y="233" fill="#d5f0f5" font-size="11" text-anchor="middle">ON CONFLICT skip</text>

  <!-- Notify -->
  <rect x="1260" y="130" width="130" height="55" rx="10" fill="#1f6f43" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="1325" y="153" fill="#ffffff" font-size="12" text-anchor="middle" font-weight="bold">Success Email</text>
  <text x="1325" y="169" fill="#d5f5e3" font-size="10" text-anchor="middle">row count</text>

  <rect x="1260" y="250" width="130" height="55" rx="10" fill="#6b2d2d" stroke="#e05c5c" stroke-width="1.5"/>
  <text x="1325" y="273" fill="#ffffff" font-size="12" text-anchor="middle" font-weight="bold">Failure Email</text>
  <text x="1325" y="289" fill="#f5d5d5" font-size="10" text-anchor="middle">on any error</text>

  <!-- Arrows -->
  <g stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M132,220 L160,110 L200,110"/>
    <path d="M132,220 L200,220"/>
    <path d="M132,220 L160,330 L200,330"/>

    <path d="M370,110 L420,110"/>
    <path d="M370,220 L420,220"/>
    <path d="M370,330 L420,330"/>

    <path d="M580,110 L640,110 L640,205 L640,220"/>
    <path d="M580,220 L640,220"/>
    <path d="M580,330 L640,330 L640,235 L640,220"/>

    <path d="M790,220 L840,220"/>
    <path d="M1000,220 L1050,220"/>
    <path d="M1210,220 L1230,220 L1230,157 L1260,157"/>
    <path d="M1210,220 L1230,220 L1230,277 L1260,277"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5b6472"/>
    </marker>
  </defs>

  <!-- Legend -->
  <text x="30" y="700" fill="#6b7280" font-size="12">Green = data source · Blue/Purple = transform · Orange = warehouse write · Red = failure path</text>
</svg>
